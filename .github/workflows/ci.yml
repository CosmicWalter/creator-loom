name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node --check creator_loom/static/app.js
      - run: node --check creator_loom/static/timeline.js
      - run: node --check website/app.js
      - run: python scripts/check_website.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/check_wheel.py dist
      - run: python scripts/check_publication.py
