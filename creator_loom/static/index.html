<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creator Loom · 创作工作台</title>
    <link rel="stylesheet" href="/app.css" />
    <script defer src="/media.js"></script>
    <script defer src="/timeline.js"></script>
    <script defer src="/lab.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <section id="login" class="login" hidden>
      <div class="login-card">
        <div class="brand-mark">L</div>
        <p class="eyebrow">CREATOR LOOM</p>
        <h1>回到你的创作空间</h1>
        <p>使用启动终端中的本机访问码连接工作台。</p>
        <form id="login-form">
          <label
            >工作台访问码<input
              id="access-code"
              type="password"
              autocomplete="off"
              required /></label
          ><button class="primary">连接工作台 <span>↗</span></button>
        </form>
        <p id="login-error" role="alert"></p>
      </div>
    </section>
    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar">
        <a href="#create" class="brand"
          ><span class="brand-mark">L</span
          ><span>Creator<br /><strong>Loom</strong></span></a
        >
        <div class="workspace-label">
          <span class="live-dot"></span> 本地创作空间
        </div>
        <nav aria-label="主导航">
          <button data-view="create">
            <span>✳</span> 创作台 <small>01</small>
          </button>
          <button data-view="runs">
            <span>▤</span> 作品档案 <small>02</small>
          </button>
          <button data-view="assets"><span>◒</span> 素材与音乐 <small>MEDIA</small></button>
          <button data-view="timelines"><span>▥</span> 剪辑台 <small>EDIT</small></button>
          <button data-view="books">
            <span>▥</span> 我的书架 <small>03</small>
          </button>
          <button data-view="research">
            <span>◎</span> 学习雷达 <small>04</small>
          </button>
          <button data-view="growth">
            <span>↗</span> 成长记录 <small>05</small>
          </button>
        </nav>
        <div class="sidebar-note">
          <span class="thread-icon">⌁</span>
          <p>好作品，<br />来自不断打磨的想法。</p>
          <small>CREATE · REFLECT · EVOLVE</small>
        </div>
        <label class="profile-label"
          >偏好档案<input
            id="profile"
            value="default"
            maxlength="64"
            aria-label="偏好档案"
        /></label>
        <div class="sidebar-footer">
          <span class="live-dot"></span> 仅本机访问 <span>↗</span>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <span id="breadcrumb">工作空间 / 创作台</span>
          <div>
            <span class="quiet-badge">OPEN SOURCE</span
            ><button id="refresh" class="icon-button" aria-label="刷新工作台">
              ↻
            </button>
          </div>
        </header>
        <div id="content" class="content"></div>
        <footer class="page-footer">
          <span>Creator Loom</span><span>每一次创作，都留下一点进步。</span>
        </footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="modal">
      <button id="close-modal" class="modal-close" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
