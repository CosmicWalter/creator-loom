[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-loom"
version = "0.2.0"
description = "An inspectable, feedback-driven agent for multimodal content creation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CosmicWalter"}]
dependencies = []

[project.scripts]
loom = "creator_loom.cli:main"

[tool.setuptools.packages.find]
include = ["creator_loom*"]
